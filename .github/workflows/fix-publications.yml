name: Fix publications and author pages

# Runs only when you click "Run workflow" in the Actions tab
on:
  workflow_dispatch:

permissions:
  contents: write   # allow the run to commit the edited files back

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Force a profile page for every author folder
        run: python3 force_author_pages.py

      - name: Add volume and pages to publication citations
        run: python3 fix_publication_fields.py

      - name: Copy admin to jian-zhou
        run: python3 add_pi_profile_page.py

      - name: Commit the changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Update author pages and publication citations" || echo "Nothing to commit"
          git push
